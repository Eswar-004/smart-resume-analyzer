<!DOCTYPE html>
<html>
    <head>
        <title>Upload Resume - Smart Resume Analyzer</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">Smart Resume Analyzer</div>
            <div class="nav-links">
                <a href="/upload" style="border-bottom: 2px solid #667eea; padding-bottom: 2px;">Upload</a>
                <a href="/history">History</a>
                <a href="/logout" class="logout-btn">Logout</a>
            </div>
        </nav>
        <div class="container">
            <div class="upload-container">
                <h1>Upload Your Resume</h1>
                <p class="subtitle">Upload your PDF resume and paste the job description to get AI-powered analysis</p>
                {% if error %}
                <div class="error">{{ error }}</div>
                {% endif %}
                <form action="/upload" method='POST' enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="resume">Resume (PDF only, max 2MB)</label>
                        <input type="file" id="resume" name="resume" accept=".pdf" required>
                    </div>
                    <div class="form-group">
                        <label for="job_description">Job Description</label>
                        <textarea id="job_description" name="job_description" placeholder="Paste the job description here..." required></textarea>
                    </div>
                    <button type="submit">Analyze Resume</button>
                </form>
            </div>
        </div>
    </body>
</html>
